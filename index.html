<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои коллекции (Версия 2.0)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; }
        .modal.active { display: flex; }
        .cursor-move * { pointer-events: none; }
        .cursor-move button, .cursor-move h3, .cursor-move img { pointer-events: auto; }
        /* Жесткое принудительное сохранение пропорций картинок */
        .force-contain { object-fit: contain !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
    
    <!-- Навигация -->
    <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
            <h1 class="text-xl font-bold text-gray-800">Мои коллекции (Версия 2.0)</h1>
        </div>
        <div class="flex items-center gap-2 text-sm text-blue-600 font-medium">
            <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
            Firebase + ImgBB
        </div>
    </header>

    <!-- Основной контент -->
    <main id="app-content" class="max-w-4xl mx-auto p-6"></main>

    <!-- Модальное окно: Новая папка -->
    <div id="modal-folder" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50" onmousedown="if(event.target===this) closeModal('modal-folder')">
        <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-2xl">
            <h2 class="text-lg font-bold mb-4">Создать папку</h2>
            <input type="text" id="folder-name" placeholder="Название (например, Смартфоны)" class="w-full border rounded p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('modal-folder')" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Отмена</button>
                <button onclick="createFolder()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Создать</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно: Новый элемент -->
    <div id="modal-item" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50" onmousedown="if(event.target===this) closeModal('modal-item')">
        <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-2xl">
            <h2 class="text-lg font-bold mb-4">Добавить вариант</h2>
            <label class="block text-sm font-medium text-gray-700 mb-1">Фотография:</label>
            <input type="file" id="item-image" accept="image/*" class="w-full border rounded p-2 mb-3 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            <input type="text" id="item-name" placeholder="Название модели" class="w-full border rounded p-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <textarea id="item-desc" placeholder="Характеристики / Описание" class="w-full border rounded p-2 mb-3 h-24 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            <input type="url" id="item-link" placeholder="Ссылка на магазин" class="w-full border rounded p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('modal-item')" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Отмена</button>
                <button onclick="createItem(this)" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно: Редактировать элемент -->
    <div id="modal-edit-item" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50" onmousedown="if(event.target===this) closeModal('modal-edit-item')">
        <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-2xl">
            <h2 class="text-lg font-bold mb-4">Редактировать вариант</h2>
            <label class="block text-sm font-medium text-gray-700 mb-1">Заменить фото (оставьте пустым для сохранения текущего):</label>
            <input type="file" id="edit-item-image" accept="image/*" class="w-full border rounded p-2 mb-3 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-yellow-500 text-sm">
            <input type="text" id="edit-item-name" class="w-full border rounded p-2 mb-3 focus:outline-none focus:ring-2 focus:ring-yellow-500">
            <textarea id="edit-item-desc" class="w-full border rounded p-2 mb-3 h-24 focus:outline-none focus:ring-2 focus:ring-yellow-500"></textarea>
            <input type="url" id="edit-item-link" class="w-full border rounded p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-yellow-500">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('modal-edit-item')" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Отмена</button>
                <button onclick="saveEditedItem(this)" class="px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно: Просмотр элемента -->
    <div id="modal-view" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50 p-4" onmousedown="if(event.target===this) closeModal('modal-view')">
        <div class="bg-white rounded-lg p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl">
            
            <img id="view-image" src="" alt="Фото" class="w-full h-64 force-contain hidden bg-white border p-2 shadow-sm mx-auto rounded-md mb-4" style="max-height: 250px;">
            
            <h2 id="view-title" class="text-2xl font-bold mb-4 text-gray-900">Название</h2>
            <div class="bg-gray-50 p-4 rounded-md mb-4 whitespace-pre-wrap text-gray-700" id="view-desc">Характеристики</div>
            <a id="view-link" href="#" target="_blank" class="inline-block text-blue-600 hover:underline mb-6 break-all">Ссылка на магазин</a>
            
            <div class="flex justify-between items-center mt-2 pt-4 border-t">
                <div class="flex gap-2">
                    <button onclick="openEditItem()" class="px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600 font-medium text-sm transition">Изменить</button>
                    <button onclick="deleteItem()" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 font-medium text-sm transition">Удалить</button>
                </div>
                <button onclick="closeModal('modal-view')" class="px-5 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300 font-medium transition">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Модули Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // Ключ от ImgBB
        const IMGBB_API_KEY = "7f47663ac076e87c6f93e1a51dea9c02";

        const firebaseConfig = {
            apiKey: "AIzaSyBl6yoasNJoBBJ5L6n48HOoLCgG2ZFyOcY",
            authDomain: "mycollections-fd72d.firebaseapp.com",
            projectId: "mycollections-fd72d",
            storageBucket: "mycollections-fd72d.firebasestorage.app",
            messagingSenderId: "998130037413",
            appId: "1:998130037413:web:084d2d5cfee1183f80d34c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const dbRef = doc(db, "myApp", "data");

        window.folders = [];
        window.currentFolderIndex = null;
        window.currentItemIndex = null;
        window.draggedItemIndex = null;
        const contentDiv = document.getElementById('app-content');

        // --- СОХРАНЕНИЕ И ЗАГРУЗКА ---
        window.saveData = async function() {
            try { await setDoc(dbRef, { folders: window.folders }); } 
            catch (error) { console.error("Ошибка сохранения:", error); alert("Не удалось сохранить данные."); }
        }

        async function loadData() {
            contentDiv.innerHTML = '<div class="flex justify-center mt-10"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div></div><p class="text-center text-gray-500 mt-4">Загрузка данных...</p>';
            try {
                const docSnap = await getDoc(dbRef);
                if (docSnap.exists()) window.folders = docSnap.data().folders || [];
                window.renderFolderList();
            } catch (error) {
                console.error("Ошибка загрузки:", error);
                contentDiv.innerHTML = '<p class="text-center text-red-500 mt-10 font-bold">Ошибка подключения. Перезагрузите страницу.</p>';
            }
        }

        // --- БЕСПЛАТНАЯ ЗАГРУЗКА ИЗОБРАЖЕНИЙ НА IMGBB ---
        window.uploadImageToImgBB = async function(file) {
            if (!file) return null;
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            if (data.success) return data.data.url;
            throw new Error("Ошибка загрузки фото");
        }

        // --- ОТРИСОВКА ИНТЕРФЕЙСА ---
        window.renderFolderList = function() {
            window.currentFolderIndex = null;
            window.currentItemIndex = null;
            let html = `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Категории</h2>
                    <button onclick="openModal('modal-folder')" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition flex gap-2 items-center">+ Новая папка</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            `;
            if (window.folders.length === 0) {
                html += `<p class="text-gray-500 col-span-3">Папок пока нет. Создайте первую!</p>`;
            } else {
                window.folders.forEach((f, i) => {
                    html += `
                        <div onclick="openFolder(${i})" class="bg-white p-5 rounded-lg border shadow-sm hover:shadow-md cursor-pointer transition flex items-center gap-3">
                            <svg class="w-8 h-8 text-blue-500" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
                            <div><h3 class="font-bold text-lg text-gray-800">${f.name}</h3><p class="text-sm text-gray-500">Вариантов: ${f.items.length}</p></div>
                        </div>`;
                });
            }
            contentDiv.innerHTML = html + `</div>`;
        }

        window.openFolder = function(index) {
            window.currentFolderIndex = index;
            const f = window.folders[index];
            let html = `
                <div class="mb-6">
                    <button onclick="renderFolderList()" class="text-blue-600 hover:underline flex items-center gap-1 mb-4">&larr; Назад к категориям</button>
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div class="flex items-center gap-3">
                            <h2 class="text-2xl font-bold text-gray-800">Папка: ${f.name}</h2>
                            <button onclick="deleteFolder()" class="text-red-500 hover:text-red-700 text-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                        <button onclick="openModal('modal-item')" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">+ Добавить вариант</button>
                    </div>
                </div>
                <div class="flex flex-col gap-3">
            `;

            if (f.items.length === 0) {
                html += `<p class="text-gray-500">В этой папке пока пусто.</p>`;
            } else {
                f.items.forEach((item, i) => {
                    // Жестко фиксируем квадрат и пропорции
                    const imgHtml = item.image 
                        ? `<img src="${item.image}" class="bg-white border rounded-md p-1 shadow-sm force-contain" style="width: 50px; height: 50px; min-width: 50px; flex-shrink: 0;">` 
                        : `<div class="bg-gray-100 rounded-md border flex items-center justify-center shadow-sm" style="width: 50px; height: 50px; min-width: 50px; flex-shrink: 0;"><svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"></path></svg></div>`;
                    
                    html += `
                        <div draggable="true" ondragstart="handleDragStart(event, ${i})" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, ${i})" 
                             class="bg-white p-3 rounded-lg border shadow-sm cursor-move hover:shadow-md transition flex justify-between items-center group">
                            <div class="flex items-center gap-3 w-full">
                                <svg class="w-5 h-5 text-gray-300 group-hover:text-blue-400 transition" style="min-width: 20px;" fill="currentColor" viewBox="0 0 24 24"><path d="M8 6a2 2 0 11-4 0 2 2 0 014 0zM8 12a2 2 0 11-4 0 2 2 0 014 0zM8 18a2 2 0 11-4 0 2 2 0 014 0zM16 6a2 2 0 11-4 0 2 2 0 014 0zM16 12a2 2 0 11-4 0 2 2 0 014 0zM16 18a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                ${imgHtml}
                                <h3 onclick="viewItem(${i})" class="font-semibold text-lg text-gray-800 hover:text-blue-600 cursor-pointer transition truncate flex-1">${item.name}</h3>
                            </div>
                            <button onclick="viewItem(${i})" class="text-gray-400 text-sm hover:text-blue-600 transition pl-2 pr-1" style="min-width: 80px;">Открыть &rarr;</button>
                        </div>`;
                });
            }
            contentDiv.innerHTML = html + `</div>`;
        }

        window.openModal = id => document.getElementById(id).classList.add('active');
        window.closeModal = id => document.getElementById(id).classList.remove('active');

        // --- УПРАВЛЕНИЕ ДАННЫМИ ---
        window.createFolder = async function() {
            const input = document.getElementById('folder-name');
            if (input.value.trim() === '') return alert('Введите название папки');
            window.folders.push({ name: input.value.trim(), items: [] }); 
            await window.saveData(); input.value = ''; window.closeModal('modal-folder'); window.renderFolderList();
        }

        window.deleteFolder = async function() {
            if (confirm('Удалить папку и всё содержимое?')) { 
                window.folders.splice(window.currentFolderIndex, 1); await window.saveData(); window.renderFolderList(); 
            }
        }

        window.createItem = async function(btnElement) {
            const name = document.getElementById('item-name').value;
            const desc = document.getElementById('item-desc').value;
            const link = document.getElementById('item-link').value;
            const fileInput = document.getElementById('item-image');
            
            if (name.trim() === '') return alert('Введите название');

            btnElement.textContent = "Загрузка...";
            btnElement.disabled = true;

            try {
                let imageUrl = null;
                if (fileInput.files.length > 0) imageUrl = await window.uploadImageToImgBB(fileInput.files[0]);
                window.folders[window.currentFolderIndex].items.push({ name: name.trim(), desc: desc.trim(), link: link.trim(), image: imageUrl });
                await window.saveData(); 
                document.getElementById('item-name').value = ''; document.getElementById('item-desc').value = ''; document.getElementById('item-link').value = ''; document.getElementById('item-image').value = '';
                window.closeModal('modal-item'); window.openFolder(window.currentFolderIndex);
            } catch (error) {
                alert("Ошибка при загрузке картинки. Попробуйте еще раз.");
            } finally {
                btnElement.textContent = "Добавить"; btnElement.disabled = false;
            }
        }

        window.viewItem = function(i) {
            window.currentItemIndex = i;
            const item = window.folders[window.currentFolderIndex].items[i];
            document.getElementById('view-title').textContent = item.name;
            document.getElementById('view-desc').textContent = item.desc || 'Нет описания';
            
            const linkEl = document.getElementById('view-link');
            if (item.link) { linkEl.href = item.link; linkEl.textContent = item.link; linkEl.style.display = 'block'; } 
            else { linkEl.style.display = 'none'; }
            
            const imgEl = document.getElementById('view-image');
            if (item.image) { 
                imgEl.src = item.image; 
                imgEl.classList.remove('hidden'); 
            } else { 
                imgEl.src = ''; 
                imgEl.classList.add('hidden'); 
            }
            
            window.openModal('modal-view');
        }

        window.openEditItem = function() {
            const item = window.folders[window.currentFolderIndex].items[window.currentItemIndex];
            document.getElementById('edit-item-name').value = item.name;
            document.getElementById('edit-item-desc').value = item.desc;
            document.getElementById('edit-item-link').value = item.link;
            document.getElementById('edit-item-image').value = '';
            window.closeModal('modal-view'); window.openModal('modal-edit-item');
        }

        window.saveEditedItem = async function(btnElement) {
            const name = document.getElementById('edit-item-name').value;
            const desc = document.getElementById('edit-item-desc').value;
            const link = document.getElementById('edit-item-link').value;
            const fileInput = document.getElementById('edit-item-image');

            if (name.trim() === '') return alert('Название не может быть пустым');
            btnElement.textContent = "Сохранение...";
            btnElement.disabled = true;

            try {
                let finalImageUrl = window.folders[window.currentFolderIndex].items[window.currentItemIndex].image;
                if (fileInput.files.length > 0) finalImageUrl = await window.uploadImageToImgBB(fileInput.files[0]);
                window.folders[window.currentFolderIndex].items[window.currentItemIndex] = { name: name.trim(), desc: desc.trim(), link: link.trim(), image: finalImageUrl };
                await window.saveData(); window.closeModal('modal-edit-item'); window.openFolder(window.currentFolderIndex); window.viewItem(window.currentItemIndex);
            } catch (error) {
                alert("Ошибка при сохранении.");
            } finally {
                btnElement.textContent = "Сохранить"; btnElement.disabled = false;
            }
        }

        window.deleteItem = async function() {
            if (confirm('Удалить этот вариант?')) { 
                window.folders[window.currentFolderIndex].items.splice(window.currentItemIndex, 1); 
                await window.saveData(); window.closeModal('modal-view'); window.openFolder(window.currentFolderIndex); 
            }
        }

        // --- DRAG & DROP ---
        window.handleDragStart = (e, i) => { window.draggedItemIndex = i; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', i); }
        window.handleDragOver = e => { e.preventDefault(); e.currentTarget.classList.add('border-blue-500', 'bg-blue-50'); };
        window.handleDragLeave = e => { e.currentTarget.classList.remove('border-blue-500', 'bg-blue-50'); };
        window.handleDrop = async (e, targetIndex) => {
            e.preventDefault(); e.currentTarget.classList.remove('border-blue-500', 'bg-blue-50');
            if (window.draggedItemIndex !== null && window.draggedItemIndex !== targetIndex) {
                const items = window.folders[window.currentFolderIndex].items;
                items.splice(targetIndex, 0, items.splice(window.draggedItemIndex, 1)[0]);
                await window.saveData(); window.openFolder(window.currentFolderIndex);
            }
            window.draggedItemIndex = null;
        }

        loadData();
    </script>
</body>
</html>
